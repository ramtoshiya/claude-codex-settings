schema_version: '1.1'
name: negative-compare-testing-tools
description: Tool selection advice is distinct from evaluating the quality of existing tests.
tags: [negative, tooling-research]
execution:
  prompt: |
    Based on package.json and test/lifecycle.test.js, compare keeping node:test
    with adopting a separate testing framework for this small standard-library
    package. Discuss dependency cost, timer control, and command-line use at a
    high level using only local evidence and your existing knowledge. Do not
    install tools, fetch documentation, judge individual tests, or migrate code.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: no-test-audit-anywhere-in-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
  - name: local-runner-evidence-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"(?:[^"]*/)?test/lifecycle\.test\.js"'
    min: 1
    arm: both
