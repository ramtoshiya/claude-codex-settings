schema_version: '1.1'
name: positive-deduplicate-tests
description: Explicit duplication analysis and consolidation are test-quality work.
tags: [positive, audit, duplication]
execution:
  prompt: |
    Find and remove duplicate assertions of the same contract in
    test/hook-options.test.js. Compare the public options boundary with the
    test-only delay wrapper before deciding which proof owns rejection behavior.
    Remove a test-only production export if the consolidation leaves it unused.
    Keep distinct contracts and validate the focused suite.
  max_turns: 24
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: automatically-selected-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 1
