schema_version: '1.1'
name: positive-prune-low-value-tests
description: Pruning low-value tests is an explicit test-quality task.
tags: [positive, audit, pruning]
execution:
  prompt: |
    Prune low-value hook-options tests and any obsolete support they alone keep
    alive. Prove the remaining public-boundary tests still protect the distinct
    default, validation, immutability, and disabled-delivery contracts. Make a
    small coherent removal batch, not a broad source refactor, and run the
    affected tests. Explain why each removed test adds no independent protection.
  max_turns: 24
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: automatically-selected-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 1
