schema_version: '1.1'
name: negative-production-source-review
description: A correctness review of production source may consult tests without assessing their quality.
tags: [negative, source-review]
execution:
  prompt: |
    Review src/lifecycle.js for production correctness, especially pause,
    resume, close, and timer ownership. Use test/lifecycle.test.js as supporting
    evidence for intended behavior. Return source bugs with concrete event
    sequences and source locations. Keep this read-only and do not broaden the
    review into test cleanup or test-quality findings.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: no-test-audit-anywhere-in-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
  - name: supporting-test-evidence-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"(?:[^"]*/)?test/lifecycle\.test\.js"'
    min: 1
    arm: both
