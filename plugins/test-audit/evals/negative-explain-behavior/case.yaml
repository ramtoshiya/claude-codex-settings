schema_version: '1.1'
name: negative-explain-behavior
description: Tests are explanatory evidence, not the requested deliverable.
tags: [negative, behavior]
execution:
  prompt: |
    Explain how automatic delivery, manual flush, and close behave for a caller
    of createLifecycle. Read src/lifecycle.js and test/lifecycle.test.js and walk
    through one concrete event sequence for each. I only need an explanation of
    existing behavior. Leave all files unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: no-test-audit-anywhere-in-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
  - name: behavior-evidence-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"(?:[^"]*/)?test/lifecycle\.test\.js"'
    min: 1
    arm: both
