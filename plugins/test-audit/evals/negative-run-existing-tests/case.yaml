schema_version: '1.1'
name: negative-run-existing-tests
description: Running and reporting the existing suite does not require a test-quality audit.
tags: [negative, validation]
execution:
  prompt: |
    Run the existing JavaScript tests with node --test test/*.test.js and report
    passed, failed, and skipped counts. If anything fails, summarize the failure
    only. Do not change files, unskip tests, add coverage, or clean up the suite.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: no-test-audit-anywhere-in-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
  - name: existing-tests-executed
    type: tool_used
    tool: Bash
    input_match: 'node\s+--test\s+test/\*\.test\.js'
    min: 1
    arm: both
