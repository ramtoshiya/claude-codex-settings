schema_version: '1.1'
name: positive-fix-flaky-tests
description: Repairing a quarantined timing-sensitive test requires assessing and changing its proof.
tags: [positive, authoring, flakiness]
execution:
  prompt: |
    Repair the skipped wall-clock delivery test in test/lifecycle.test.js.
    Replace the timing assumption with deterministic scheduler control using
    the existing clock helper, preserve meaningful proof of automatic delivery,
    and enable it again. If the same contract already has a stronger owner,
    consolidate rather than keep two copies. Run the lifecycle tests.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: automatically-selected-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 1
