schema_version: '1.1'
name: positive-author-new-tests
description: Authoring new behavioral tests requires the automatic authoring gate.
tags: [positive, authoring]
execution:
  prompt: |
    Add focused tests for resolveHookOptions accepting delayMs at both inclusive
    boundaries, 0 and 60000. Use the existing node:test suite and its public
    options boundary. Keep production behavior unchanged, avoid repeating the
    existing invalid-delay cases, and run the affected test file.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: automatically-selected-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 1
