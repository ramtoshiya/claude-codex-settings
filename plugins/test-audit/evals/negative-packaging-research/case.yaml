schema_version: '1.1'
name: negative-packaging-research
description: Packaging research may inspect pack tests without becoming a test-quality audit.
tags: [negative, replay, regression, packaging]
execution:
  prompt: |
    Research this package's distribution conventions without changing anything.
    Start with package.json and bin/dispatch.js, then read test/pack.test.js as
    evidence. Explain which directories ship, how the command entry is included,
    and what package checks a maintainer would run before release. Keep this a
    read-only packaging report, not a proposal to rewrite the checks.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: Work directly without delegating. Use local workspace evidence only. Do not install dependencies, access the network, or commit.
context:
  scaffold_script: setup.sh
graders:
  - name: no-test-audit-anywhere-in-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
  - name: packaging-test-evidence-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"(?:[^"]*/)?test/pack\.test\.js"'
    min: 1
    arm: both
